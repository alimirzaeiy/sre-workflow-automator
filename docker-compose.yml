version: '3.8'

services:
  deploy-automation:
    build: .
    container_name: deploy_automation_bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8085:8085"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 5s
      retries: 3
